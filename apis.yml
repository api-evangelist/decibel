aid: decibel
name: Decibel
description: >-
  Decibel (Decibel Partners) is an early-stage venture capital firm that invests in essential infrastructure
  software used by developers, data engineers and cybersecurity teams, describing itself as "early believers in
  technical founders." It keeps a deliberately small portfolio, says no to investments outside its expertise, and
  backs companies from the earliest stage across four sectors: Cybersecurity, Developer Platforms, Data / ML / AI
  Infrastructure and Autonomous Software. Founded by Jon Sakoda, it supports founders with a community of early
  adopters (CISOs, CTOs, VPs of Engineering and Data), GTM playbooks, founder advisors and talent help, and has
  a Managing Director for APAC and Japan. Exits on its portfolio page include Cmd (Elastic), Pachyderm (HPE),
  Pangea (CrowdStrike), Propelo (Harness), Blameless (Freshworks), Nira (Dropbox) and runZero (Accenture).
